# Netlify Configuration when building directly within client directory
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"
  SECRETS_SCAN_OMIT_KEYS = "PORT,MONGODB_URI,JWT_SECRET"
  SECRETS_SCAN_ENABLED = "false"

# Proxy all /api/* requests to Render backend
[[redirects]]
  from = "/api/*"
  to = "https://cyber-aware-api.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
