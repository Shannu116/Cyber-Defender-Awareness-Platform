# Netlify Configuration for Cyber Defender

[build]
  # Base directory where client package.json is located
  base = "client"
  # Command to build the Vite React application
  command = "npm run build"
  # Directory that contains the built static files (relative to base directory)
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"
  SECRETS_SCAN_OMIT_KEYS = "PORT,MONGODB_URI,JWT_SECRET"
  SECRETS_SCAN_ENABLED = "false"

# Proxy all /api/* requests to Render backend
[[redirects]]
  from = "/api/*"
  to = "https://cyber-aware-api.onrender.com/api/:splat"
  status = 200
  force = true

# SPA routing redirect rule: routes all URLs to index.html with a 200 status
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
